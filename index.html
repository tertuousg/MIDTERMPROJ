<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Complete POS Demo</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#152238;background:#f4f7fb;--nav:#102a43;--blue:#126bb5;--line:#d9e2ec}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}header{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:16px max(20px,calc((100vw - 1100px)/2));background:var(--nav);color:#fff}.brand{font-weight:900;font-size:19px}nav{display:flex;align-items:center;flex-wrap:wrap;gap:15px}nav button{border:0;padding:0;background:none;color:#d9e8f5;cursor:pointer}.wrap{width:min(1100px,calc(100% - 28px));margin:34px auto}.heading{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:18px}h1{margin:3px 0;font-size:clamp(28px,5vw,40px)}h2{margin:0}.eyebrow{margin:0;color:#567087;font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.btn{border:0;border-radius:9px;padding:11px 16px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}.btn.gray{background:#e7eef5;color:#243b53}.btn.red{background:#c53030}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px}.stat,.card,.tablebox,.modalbox{border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 9px 28px #102a430d}.stat{padding:22px}.stat b{display:block;color:var(--blue);font-size:34px}.product{overflow:hidden}.product .pic{display:grid;place-items:center;height:150px;background:linear-gradient(135deg,#dbeafe,#e2e8f0);font-size:54px}.product .inside{padding:16px}.price{color:var(--blue);font-weight:900;font-size:21px}.actions{display:flex;gap:10px;align-items:center}.link{border:0;padding:0;background:none;color:var(--blue);font-weight:800;text-decoration:underline;cursor:pointer}.link.danger{color:#c53030}.tablebox{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:13px 15px;border-bottom:1px solid #e7eef5;text-align:left}th{background:#eef4f8;color:#334e68;font-size:12px;text-transform:uppercase}.avatar{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:#dbeafe;font-weight:900}.empty{text-align:center;color:#627d98}.notice{margin-bottom:16px;border-radius:9px;padding:11px 14px;background:#f0fff4;color:#22543d}.login{max-width:430px;margin:10vh auto;padding:28px}.field{margin:15px 0}.field label{display:block;margin-bottom:6px;font-weight:800}.field input,.field select{width:100%;border:1px solid #bcccdc;border-radius:9px;padding:11px}.help{color:#627d98;font-size:13px}.modal{position:fixed;inset:0;display:none;place-items:center;padding:20px;background:#0f172ab3;z-index:5}.modal.open{display:grid}.modalbox{width:min(520px,100%);max-height:90vh;overflow:auto;padding:24px}.modalhead{display:flex;justify-content:space-between;gap:15px}.close{border:0;background:none;font-size:25px;cursor:pointer}.hide{display:none!important}@media(max-width:760px){header,.heading{align-items:flex-start;flex-direction:column}nav{gap:11px}.wrap{margin-top:24px}}
</style>
</head>
<body>
<header><div class="brand">Complete POS</div><nav id="nav" class="hide"><button onclick="go('dashboard')">Dashboard</button><button onclick="go('products')">Products</button><button onclick="go('customers')">Customers</button><button onclick="go('staff')">Staff</button><button onclick="go('sale')">Record Sale</button><button onclick="go('history')">Sales History</button><button onclick="logout()">Logout</button></nav></header>
<main class="wrap" id="app"></main>
<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle"></h2><button class="close" onclick="closeModal()">×</button></div><form id="modalForm"></form></div></div>
<script>
const seed={products:[{id:1,name:'Wireless Mouse',price:599,stock:25},{id:2,name:'Mechanical Keyboard',price:1899,stock:12},{id:3,name:'USB-C Cable',price:249,stock:40}],customers:[{id:1,name:'Juan Dela Cruz',email:'juan@example.com',phone:'09171234567'},{id:2,name:'Maria Santos',email:'maria@example.com',phone:'09181234567'}],staff:[{id:1,username:'admin',name:'System Administrator',password:'password123'}],sales:[]};
let db=JSON.parse(localStorage.getItem('pos_demo')||'null')||structuredClone(seed),logged=sessionStorage.getItem('pos_login')==='1',page='dashboard';
const app=document.querySelector('#app'),nav=document.querySelector('#nav');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const peso=n=>'₱'+Number(n).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const save=()=>localStorage.setItem('pos_demo',JSON.stringify(db)); const next=a=>a.length?Math.max(...a.map(x=>x.id))+1:1;
function loginView(){nav.classList.add('hide');app.innerHTML=`<section class="card login"><p class="eyebrow">Staff access</p><h1>Sign in</h1><form onsubmit="login(event)"><div class="field"><label>Username</label><input name="u" required autofocus></div><div class="field"><label>Password</label><input name="p" type="password" required></div><button class="btn" style="width:100%">Login</button><p class="help">Demo: admin / password123</p><p id="loginError" style="color:#c53030"></p></form></section>`}
function login(e){e.preventDefault();let f=new FormData(e.target),u=db.staff.find(x=>x.username===f.get('u')&&x.password===f.get('p'));if(!u)return document.querySelector('#loginError').textContent='Invalid username or password.';logged=true;sessionStorage.setItem('pos_login','1');go('dashboard')}
function logout(){logged=false;sessionStorage.removeItem('pos_login');loginView()}
function go(p){if(!logged)return loginView();page=p;nav.classList.remove('hide');render()}
function render(){({dashboard,products,customers,staff,sale,history}[page]||dashboard)()}
function head(k,t,b=''){return `<div class="heading"><div><p class="eyebrow">${k}</p><h1>${t}</h1></div>${b}</div>`}
function dashboard(){app.innerHTML=head('Overview','Welcome, System Administrator',`<button class="btn" onclick="go('sale')">Record Sale</button>`)+`<div class="grid"><div class="stat"><b>${db.products.length}</b>Products</div><div class="stat"><b>${db.customers.length}</b>Customers</div><div class="stat"><b>${db.staff.length}</b>Staff</div><div class="stat"><b>${db.sales.length}</b>Sales</div></div>`}
function products(){app.innerHTML=head('Inventory','Products',`<button class="btn" onclick="productForm()">New Product</button>`)+`<div class="grid">${db.products.map(p=>`<article class="card product"><div class="pic">📦</div><div class="inside"><h2>${esc(p.name)}</h2><p class="price">${peso(p.price)}</p><p>Stock: ${p.stock}</p><div class="actions"><button class="link" onclick="productForm(${p.id})">Edit</button><button class="link danger" onclick="removeItem('products',${p.id})">Delete</button></div></div></article>`).join('')}</div>`}
function productForm(id){let p=db.products.find(x=>x.id===id)||{};openModal(id?'Edit Product':'New Product',`<div class="field"><label>Name</label><input name="name" value="${esc(p.name||'')}" required></div><div class="field"><label>Price</label><input name="price" type="number" min="0" step=".01" value="${p.price??''}" required></div><div class="field"><label>Stock</label><input name="stock" type="number" min="0" value="${p.stock??0}" required></div><button class="btn">Save Product</button>`,f=>{let v={id:id||next(db.products),name:f.get('name'),price:+f.get('price'),stock:+f.get('stock')};upsert('products',v);go('products')})}
function customers(){app.innerHTML=head('Account management','Customers',`<button class="btn" onclick="customerForm()">New Customer</button>`)+table(['Full Name','Email','Phone','Actions'],db.customers.map(c=>[esc(c.name),esc(c.email),esc(c.phone||'—'),`<div class="actions"><button class="link" onclick="customerForm(${c.id})">Edit</button><button class="link danger" onclick="removeItem('customers',${c.id})">Delete</button></div>`]))}
function customerForm(id){let c=db.customers.find(x=>x.id===id)||{};openModal(id?'Edit Customer':'New Customer',`<div class="field"><label>Full name</label><input name="name" value="${esc(c.name||'')}" required></div><div class="field"><label>Email</label><input name="email" type="email" value="${esc(c.email||'')}" required></div><div class="field"><label>Phone</label><input name="phone" value="${esc(c.phone||'')}"></div><button class="btn">Save Customer</button>`,f=>{upsert('customers',{id:id||next(db.customers),name:f.get('name'),email:f.get('email'),phone:f.get('phone')});go('customers')})}
function staff(){app.innerHTML=head('Access management','Staff Accounts',`<button class="btn" onclick="staffForm()">New Staff</button>`)+table(['','Username','Full Name','Actions'],db.staff.map(s=>[`<span class="avatar">${esc(s.name[0])}</span>`,esc(s.username),esc(s.name),`<div class="actions"><button class="link" onclick="staffForm(${s.id})">Edit</button>${s.id===1?'':`<button class="link danger" onclick="removeItem('staff',${s.id})">Delete</button>`}</div>`]))}
function staffForm(id){let s=db.staff.find(x=>x.id===id)||{};openModal(id?'Edit Staff':'New Staff',`<div class="field"><label>Username</label><input name="username" value="${esc(s.username||'')}" required></div><div class="field"><label>Full name</label><input name="name" value="${esc(s.name||'')}" required></div><div class="field"><label>Password ${id?'(leave blank to keep current)':''}</label><input name="password" type="password" ${id?'':'required'} minlength="8"></div><button class="btn">Save Staff</button>`,f=>{if(db.staff.some(x=>x.username===f.get('username')&&x.id!==id))return alert('Username already exists.');upsert('staff',{id:id||next(db.staff),username:f.get('username'),name:f.get('name'),password:f.get('password')||s.password});go('staff')})}
function sale(){app.innerHTML=head('Transaction','Record Sale')+`<section class="card"><form onsubmit="recordSale(event)"><div class="field"><label>Product</label><select name="product" required><option value="">Select product</option>${db.products.filter(p=>p.stock>0).map(p=>`<option value="${p.id}">${esc(p.name)} — ${peso(p.price)} (${p.stock} in stock)</option>`).join('')}</select></div><div class="field"><label>Customer (optional)</label><select name="customer"><option value="">Walk-in customer</option>${db.customers.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Quantity</label><input name="quantity" type="number" min="1" value="1" required></div><button class="btn">Complete Sale</button></form></section>`}
function recordSale(e){e.preventDefault();let f=new FormData(e.target),p=db.products.find(x=>x.id===+f.get('product')),q=+f.get('quantity');if(!p||q>p.stock)return alert('Requested quantity exceeds available stock.');p.stock-=q;db.sales.unshift({id:next(db.sales),product:p.name,customer:db.customers.find(x=>x.id===+f.get('customer'))?.name||'Walk-in',staff:'System Administrator',quantity:q,total:p.price*q,date:new Date().toLocaleString()});save();alert('Sale recorded and stock updated.');go('history')}
function history(){app.innerHTML=head('Transactions','Sales History',`<button class="btn" onclick="go('sale')">Record Sale</button>`)+table(['Date','Product','Customer','Staff','Qty','Total'],db.sales.map(s=>[esc(s.date),esc(s.product),esc(s.customer),esc(s.staff),s.quantity,peso(s.total)]))}
function table(h,rows){return `<div class="tablebox"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join(''):`<tr><td class="empty" colspan="${h.length}">No records found.</td></tr>`}</tbody></table></div>`}
function openModal(title,html,fn){document.querySelector('#modalTitle').textContent=title;let form=document.querySelector('#modalForm');form.innerHTML=html;form.onsubmit=e=>{e.preventDefault();fn(new FormData(form));closeModal()};document.querySelector('#modal').classList.add('open')}
function closeModal(){document.querySelector('#modal').classList.remove('open')}
function upsert(k,v){let i=db[k].findIndex(x=>x.id===v.id);i<0?db[k].push(v):db[k][i]=v;save()}
function removeItem(k,id){if(!confirm('Delete this record?'))return;db[k]=db[k].filter(x=>x.id!==id);save();render()}
logged?go('dashboard'):loginView();
</script>
</body>
</html>
